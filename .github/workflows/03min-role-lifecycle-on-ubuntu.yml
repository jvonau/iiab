name: '"03 min" Role Lifecycle on Ubuntu'

# Runs scripts/test-role-lifecycle.py against every active role, sharded across
# parallel jobs. The test uses a mocked filesystem/service environment, so it
# needs neither sudo nor a full IIAB install.

on:
  push:
    paths:
      - 'roles/**'
      - 'scripts/**'
      - 'vars/**'
      - 'modules/**'
      - 'ansible.cfg'
      - '.github/workflows/03min-role-lifecycle-on-ubuntu.yml'
  pull_request:  # needed to show up in Pull Request UI
    paths:
      - 'roles/**'
      - 'scripts/**'
      - 'vars/**'
      - 'modules/**'
      - 'ansible.cfg'
      - '.github/workflows/03min-role-lifecycle-on-ubuntu.yml'
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - run: echo "🎉 Triggered by a ${{ github.event_name }} event"
      - run: 'echo "🔎 Branch: ${{ github.ref }}"'

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install ansible-core
        run: python -m pip install --upgrade pip ansible-core

      - name: Test role lifecycles (shard ${{ matrix.shard }})
        run: python3 scripts/test-role-lifecycle.py --all --shard '${{ matrix.shard }}'
