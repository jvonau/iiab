---
# Entry point. This file only validates and dispatches to the lifecycle task
# files; see "Role task lifecycle" in the top-level README.md.
#
#   update.yml     the only phase that installs packages or downloads Matomo
#   install.yml    offline-safe install/repair of the local database and services
#   configure.yml  always runs; NGINX, the one-time web installer, and settings
#   state.yml      records the reported settings in iiab.ini

- name: Validate Matomo settings
  import_tasks: validate.yml

# capture this before install.yml writes the marker
- name: Remember whether the Matomo web installer still needs to run
  set_fact:
    matomo_needs_setup: "{{ matomo_installed is undefined }}"

- block:

    - name: Install packages and download Matomo
      include_tasks: update.yml
      when: matomo_installed is undefined

    - name: Install or repair Matomo
      include_tasks: install.yml

    - name: Apply Matomo configuration
      include_tasks: configure.yml

    - name: Record Matomo state
      include_tasks: state.yml

  rescue:

    - name: 'SEE ERROR ABOVE (skip_role_on_error: {{ skip_role_on_error }})'
      fail:
        msg: ""
      when: not skip_role_on_error
