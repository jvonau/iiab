---
# Offline-safe install/repair phase. Runs on every apply, but only touches the
# local filesystem: update.yml owns package installation and the optional
# source build.

- name: Check whether the transmission-daemon package is installed
  command: "dpkg-query -W -f='${db:Status-Status}' transmission-daemon"
  register: transmission_package_status
  changed_when: false
  failed_when: false
  check_mode: no

- name: Fail if the transmission-daemon package is missing
  fail:
    msg: >-
      The transmission-daemon package is not installed. Run
      './runrole --add transmission' while online to install it.
  when: (transmission_package_status.rc != 0) or (transmission_package_status.stdout | trim != 'installed')

- name: Create download dir {{ transmission_download_dir }}, owned by {{ transmission_user }}:{{ transmission_group }}
  file:
    state: directory
    path: "{{ transmission_download_dir }}"    # /library/transmission
    owner: "{{ transmission_user }}"     # debian-transmission
    group: "{{ transmission_group }}"    # debian-transmission

- name: "Set 'transmission_installed: True'"
  set_fact:
    transmission_installed: True

- name: "Add 'transmission_installed: True' to {{ iiab_state_file }}"
  lineinfile:
    path: "{{ iiab_state_file }}"    # /etc/iiab/iiab_state.yml
    regexp: '^transmission_installed'
    line: 'transmission_installed: True'
