---
# Included only when 'uninstall' is set.
#
# Remove the AWStats package, its configuration, the NGINX shortcut, and the
# summary data. This phase is local and does not need the network.

- name: Remove the AWStats NGINX shortcut
  file:
    path: "{{ nginx_conf_dir }}/awstats-nginx.conf"
    state: absent
  notify:
    - Restart nginx
    - Restart nginx via pdsm

- name: Remove AWStats configuration, CGI directory, and summary data
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/awstats/awstats.conf
    - /etc/awstats/awstats.conf.dist
    - /etc/awstats/awstats.schoolserver.conf
    - /etc/nginx/cgi-bin.php
    - /usr/lib/cgi-bin/awstats
    - "{{ awstats_data_dir }}"

- name: Remove the awstats package
  package:
    name: awstats
    state: absent

- name: Remove AWStats entries from {{ iiab_state_file }}
  lineinfile:
    path: "{{ iiab_state_file }}"
    regexp: '^awstats_'
    state: absent
  when: iiab_state_file is file

- name: Record that AWStats is uninstalled in {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"
    section: awstats
    option: awstats_install
    value: "False"

- name: Record that AWStats is disabled in {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"
    section: awstats
    option: awstats_enabled
    value: "False"
