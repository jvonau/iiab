---
# Offline-safe install/repair phase. Runs on every apply, but only touches the
# local filesystem: update.yml owns the package installation.

- name: Check whether the awstats package is installed
  command: "dpkg-query -W -f='${db:Status-Status}' awstats"
  register: awstats_package_status
  changed_when: false
  failed_when: false
  check_mode: no

- name: Fail if the awstats package is missing
  fail:
    msg: >-
      The awstats package is not installed. Run
      './runrole --add awstats' while online to install it.
  when: (awstats_package_status.rc != 0) or (awstats_package_status.stdout | trim != 'installed')

- name: Record (initial) disk space used
  shell: df -B1 --output=used / | tail -1
  register: df1

- name: Create 2 directories... mkdir {{ awstats_data_dir }} (intermediate summary storage) and /usr/lib/cgi-bin/awstats, recursively chown {{ apache_user }}:{{ apache_user }}, with chmod u+rw,g+r,g-w,o-rwx
  file:
    state: directory
    recurse: yes
    path: "{{ item }}"
    owner: "{{ apache_user }}"    # USED FOR NGINX TOO: 'www-data' on debuntu
    group: "{{ apache_user }}"
    mode: u+rw,g+r,g-w,o-rwx    # '0750' turned on too many x bits
  with_items:
    - "{{ awstats_data_dir }}"    # /library/awstats
    - /usr/lib/cgi-bin/awstats    # create backward compatible path for awstats

- name: Record (final) disk space used
  shell: df -B1 --output=used / | tail -1
  register: df2

- name: Add 'awstats_disk_usage = {{ df2.stdout | int - df1.stdout | int }}' to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: awstats
    option: awstats_disk_usage
    value: "{{ df2.stdout | int - df1.stdout | int }}"

- name: "Set 'awstats_installed: True'"
  set_fact:
    awstats_installed: True

- name: "Add 'awstats_installed: True' to {{ iiab_state_file }}"
  lineinfile:
    path: "{{ iiab_state_file }}"    # /etc/iiab/iiab_state.yml
    regexp: '^awstats_installed'
    line: 'awstats_installed: True'
