---
# Entry point. This file only validates and dispatches to the lifecycle task
# files; see "Role task lifecycle" in the top-level README.md.
#
#   update.yml     the only phase that installs the package
#   install.yml    offline-safe install/repair
#   configure.yml  always runs; configuration and the NGINX shortcut
#   uninstall.yml  cleanup for --uninstall
#   state.yml      records the reported settings in iiab.ini

- name: Uninstall AWStats
  include_tasks: uninstall.yml
  when: uninstall

- name: Apply AWStats
  when: not uninstall
  block:

    - name: Validate AWStats settings
      include_tasks: validate.yml

    - block:

        - name: Install the AWStats package
          include_tasks: update.yml
          when: awstats_installed is undefined

        - name: Install or repair AWStats
          include_tasks: install.yml

        - name: Apply AWStats configuration
          include_tasks: configure.yml

        - name: Record AWStats state
          include_tasks: state.yml

      rescue:

        - name: 'SEE ERROR ABOVE (skip_role_on_error: {{ skip_role_on_error }})'
          fail:
            msg: ""
          when: not skip_role_on_error
